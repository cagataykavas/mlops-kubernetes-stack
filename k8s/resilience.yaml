apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ml-model-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ml-model-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ml-model-service
spec:
  podSelector:
    matchLabels:
      app: ml-model-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
