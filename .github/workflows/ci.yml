name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python -m pytest -q
      - run: python scripts/validate_manifests.py
      - run: python train_model.py
      - run: python -c "from app import readiness; assert readiness()['status'] == 'ready'"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: model-api:ci
      - run: docker run -d --name model-api -p 8000:8000 model-api:ci
      - run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs model-api
          exit 1
      - run: curl -fsS http://localhost:8000/metrics | grep ml_model_ready
